# =============================================================================
# Configuration SonarCloud — projet VoiceCraft (voice-app-generator)
# À placer à la RACINE du dépôt, au même niveau que le dossier .github/
# =============================================================================

sonar.projectKey=marwaboussaha_summer-intership
sonar.organization=marwaboussaha

# -----------------------------------------------------------------------------
# Périmètre d'analyse
# -----------------------------------------------------------------------------
sonar.sources=backend,frontend/src

# backend/sandboxes/ = code généré dynamiquement par /api/generate.
# Son inclusion faisait passer l'analyse de 17 à 252 issues sans rapport
# avec le code applicatif (cf. journal de remédiation, section 2.3).
sonar.exclusions=backend/sandboxes/**,\
  backend/tests/**,\
  **/node_modules/**,\
  frontend/dist/**,\
  **/coverage/**

# -----------------------------------------------------------------------------
# Tests
# Un fichier ne peut pas être à la fois dans sonar.sources et sonar.tests,
# d'où la présence de backend/tests/** dans sonar.exclusions ci-dessus.
# -----------------------------------------------------------------------------
sonar.tests=backend/tests
sonar.test.inclusions=**/*.test.js

# -----------------------------------------------------------------------------
# Couverture
# Le scanner ne calcule rien lui-même : il lit le lcov.info produit par Jest.
# Le workflow réécrit les chemins du rapport (SF:... -> SF:backend/...) avant
# le scan, sinon aucun fichier n'est résolu et la couverture retombe à 0 %.
# -----------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Périmètre du CALCUL de couverture uniquement.
# Ces fichiers restent analysés pour la sécurité, la fiabilité et la
# maintenabilité : seul le ratio de couverture les ignore. Ils orchestrent des
# appels externes (Groq, Docker, MongoDB) dont le test unitaire exigeait une
# infrastructure de mocks hors périmètre du stage.
sonar.coverage.exclusions=backend/server.js,\
  backend/routes/**,\
  backend/services/**,\
  backend/sandbox/**,\
  backend/test-groq.js,\
  backend/database/**,\
  database/**,\
  frontend/**

# -----------------------------------------------------------------------------
# Duplications
# Le template de sandbox ressemble par construction au code applicatif ;
# le compter comme duplication n'a pas de sens.
# -----------------------------------------------------------------------------
sonar.cpd.exclusions=backend/sandbox/template/**,backend/tests/**

# -----------------------------------------------------------------------------
# Divers
# -----------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8