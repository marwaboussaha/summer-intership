name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_URL: https://staging.monapp.com

jobs:
  ##########################################################################
  # 1. SECRET SCANNING - Gitleaks
  ##########################################################################
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ##########################################################################
  # 2. INSTALL DEPENDENCIES
  ##########################################################################
  install-dependencies:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Installer dépendances Frontend
        run: cd frontend && npm ci
      - name: Installer dépendances Backend
        run: cd backend && npm ci
      - name: Sauvegarder node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: |
            frontend/node_modules
            backend/node_modules
          retention-days: 1

  ##########################################################################
  # 3. SAST - SonarQube
  ##########################################################################
  sast-sonarqube:
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Vérification explicite : si ce fichier n'existe pas ici, le scan
      # n'a pas généré de tâche d'analyse (mauvais sonar.projectBaseDir,
      # scan qui n'a pas tourné, etc). On préfère planter ICI avec un
      # message clair plutôt que 2 jobs plus tard dans sast-quality-gate.
      - name: Vérifier que le rapport Sonar existe
        run: |
          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::.scannerwork/report-task.txt introuvable après le scan Sonar."
            exit 1
          fi
          echo "Rapport trouvé :"
          cat .scannerwork/report-task.txt

      # /!\ CORRECTIF PRINCIPAL /!\
      # actions/upload-artifact@v4 IGNORE par défaut les fichiers et dossiers
      # cachés (commençant par un point). Comme .scannerwork/ est un dossier
      # caché, l'upload "réussissait" mais l'artefact était vide, donc
      # sast-quality-gate ne trouvait jamais le fichier au téléchargement.
      # include-hidden-files: true force l'inclusion de .scannerwork/.
      # if-no-files-found: error fait planter CE job si jamais le fichier
      # n'est plus là, au lieu d'un échec silencieux et différé.
      - name: Uploader le report SonarQube (report-task.txt)
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  ##########################################################################
  # 4. SAST QUALITY GATE (job séparé, comme demandé)
  ##########################################################################
  sast-quality-gate:
    runs-on: ubuntu-latest
    needs: sast-sonarqube
    steps:
      # Récupère report-task.txt uploadé par le job précédent, et le replace
      # dans .scannerwork/ pour que sonarqube-quality-gate-action le trouve
      # au même chemin relatif qu'attendu (.scannerwork/report-task.txt).
      - name: Télécharger le report SonarQube
        uses: actions/download-artifact@v4
        with:
          name: sonar-report
          path: .scannerwork

      - name: Vérifier que le fichier est bien arrivé
        run: |
          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::report-task.txt absent après téléchargement de l'artefact."
            exit 1
          fi

      # /!\ STEP DE DEBUG TEMPORAIRE /!\
      # Le job plantait avec "curl: (22) ... 403" à l'appel de l'API Sonar
      # (/api/ce/task) fait en interne par sonarqube-quality-gate-action.
      # Un 403 veut dire que le serveur répond mais refuse l'accès :
      # soit un pare-feu/WAF bloque l'IP du runner GitHub, soit le token
      # SONAR_TOKEN n'a pas les droits "Browse" sur le projet.
      # Ce step appelle directement l'API avec -v pour voir le vrai
      # message d'erreur renvoyé par le serveur (bien plus parlant qu'un
      # simple code retour). A retirer une fois le problème identifié.
      - name: "Debug - tester l'accès direct à l'API Sonar"
        # Auth via header Authorization plutôt que "curl -u token:" :
        # ce dernier pattern déclenche un faux positif sur la règle
        # gitleaks "curl-auth-user" (elle matche la syntaxe -u user:pass
        # même quand la valeur est une variable d'env, pas un secret en clair).
        run: |
          SERVER_URL=$(grep serverUrl .scannerwork/report-task.txt | cut -d'=' -f2-)
          echo "Serveur détecté : $SERVER_URL"
          curl -v -H "Authorization: Bearer ${SONAR_TOKEN}" "$SERVER_URL/api/system/status"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Vérifier la Quality Gate SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ##########################################################################
  # 5. SCA - Snyk (Dependency Scan)
  ##########################################################################
  dependency-scan-snyk:
    runs-on: ubuntu-latest
    needs: sast-quality-gate
    steps:
      - uses: actions/checkout@v4
      - name: "Sca: Snyk - Scan des dépendances"
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

  ##########################################################################
  # 6. BUILD - Images Front / Back / Database
  ##########################################################################
  build-images:
    runs-on: ubuntu-latest
    needs: dependency-scan-snyk
    strategy:
      matrix:
        service: [frontend, backend, database]
    steps:
      - uses: actions/checkout@v4
      - name: Build image ${{ matrix.service }}
        run: |
          docker build -t ${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
          docker save ${{ matrix.service }}:${{ github.sha }} -o ${{ matrix.service }}-image.tar
      - name: Sauvegarder l'image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}-image.tar
          retention-days: 1

  ##########################################################################
  # 7. IMAGE SCAN - Trivy
  ##########################################################################
  scan-images:
    runs-on: ubuntu-latest
    needs: build-images
    strategy:
      matrix:
        service: [frontend, backend, database]
    steps:
      - name: Télécharger l'image
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-image
      - name: Charger l'image Docker
        run: docker load -i ${{ matrix.service }}-image.tar
      - name: Scan Trivy (Critical/High = bloquant)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Scan Trivy (Medium/Low = informatif)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          severity: "MEDIUM,LOW"
          exit-code: "0"

  ##########################################################################
  # 8. TAG & PUSH - Registry (GitHub Container Registry)
  ##########################################################################
  tag-and-push:
    runs-on: ubuntu-latest
    needs: scan-images
    strategy:
      matrix:
        service: [frontend, backend, database]
    steps:
      - name: Télécharger l'image
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-image
      - name: Charger l'image
        run: docker load -i ${{ matrix.service }}-image.tar
      - name: Login au registre
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag & Push
        run: |
          docker tag ${{ matrix.service }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          docker tag ${{ matrix.service }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest

  ##########################################################################
  # 9. DEPLOY - Staging
  ##########################################################################
  deploy-staging:
    runs-on: ubuntu-latest
    needs: tag-and-push
    environment: staging
    steps:
      - name: Configurer kubectl
        uses: azure/setup-kubectl@v4
      - name: Déployer sur staging
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
          kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }} -n staging
          kubectl set image deployment/backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }} -n staging
          kubectl rollout status deployment/frontend -n staging
          kubectl rollout status deployment/backend -n staging

  ##########################################################################
  # 10. DAST - OWASP ZAP
  ##########################################################################
  dast-owasp-zap:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.STAGING_URL }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-l HIGH"
      - name: Sauvegarder le rapport ZAP
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html