name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_URL: https://staging.monapp.com

jobs:
  ##########################################################################
  # 1. SECRET SCANNING - Gitleaks
  ##########################################################################
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ##########################################################################
  # 2. INSTALL DEPENDENCIES
  #
  # Vérifie que les dépendances s'installent correctement et remplit le
  # cache npm. On ne transfère plus node_modules par artefact : les liens
  # symboliques de node_modules/.bin et les droits d'exécution sont perdus
  # (cause de l'erreur "Cannot find module .../node_modules/.bin/jest").
  ##########################################################################
  install-dependencies:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Installer dépendances Frontend
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Installer dépendances Backend
        working-directory: backend
        run: npm ci --ignore-scripts

  ##########################################################################
  # 3. TESTS - Backend (génère le rapport de couverture pour Sonar)
  ##########################################################################
  run-tests:
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances backend
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Lancer les tests backend avec couverture
        working-directory: backend
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config jest.config.js --coverage

      - name: Sauvegarder le rapport de couverture (lcov)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  ##########################################################################
  # 4. SAST - SonarQube
  ##########################################################################
  sast-sonarqube:
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Restaurer le rapport de couverture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report
          path: backend/coverage

      - name: Vérifier lcov.info et adapter les chemins pour Sonar
        run: |
          if [ ! -f backend/coverage/lcov.info ]; then
            echo "::error::backend/coverage/lcov.info introuvable, la couverture ne sera pas remontée à Sonar."
            exit 1
          fi
          # Jest écrit des chemins relatifs à backend/ (SF:src/...).
          # Sonar scanne depuis la racine du dépôt : on préfixe par backend/.
          sed -i -E 's#^SF:([^/])#SF:backend/\1#' backend/coverage/lcov.info
          head -n 5 backend/coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@13990a695682794b53148ff9f6a8b6e22e43955e # v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

      - name: Vérifier que le rapport Sonar existe
        run: |
          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::.scannerwork/report-task.txt introuvable après le scan Sonar."
            exit 1
          fi
          echo "Rapport trouvé :"
          cat .scannerwork/report-task.txt

      - name: Uploader le report SonarQube (report-task.txt)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-report
          path: .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  ##########################################################################
  # 5. SAST QUALITY GATE
  ##########################################################################
  sast-quality-gate:
    runs-on: ubuntu-latest
    needs: sast-sonarqube
    steps:
      - name: Télécharger le report SonarQube
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sonar-report
          path: .scannerwork

      - name: Vérifier que le fichier est bien arrivé
        run: |
          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::report-task.txt absent après téléchargement de l'artefact."
            exit 1
          fi

      - name: Vérifier la Quality Gate SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ##########################################################################
  # 6. SCA - Snyk (Dependency Scan)
  ##########################################################################
  dependency-scan-snyk:
    runs-on: ubuntu-latest
    needs: sast-quality-gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Sca: Snyk - Scan des dépendances"
        uses: snyk/actions/node@9cf6ca713d71123d2d229cc3d7f145b96ea3c518 # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

  ##########################################################################
  # 7. BUILD - Images Front / Back / Database
  #
  #   - Si un Dockerfile existe déjà -> on l'utilise tel quel.
  #   - S'il manque -> on en génère un par défaut (Node/Express pour
  #     backend, Vite/React + nginx pour frontend).
  #   - database : sans Dockerfile, on utilise l'image officielle mongo:7.
  ##########################################################################
  build-images:
    runs-on: ubuntu-latest
    needs: dependency-scan-snyk
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, database]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Diagnostic - lister le contenu de ./${{ matrix.service }}"
        run: |
          echo "Contenu de ./${{ matrix.service }} :"
          ls -la ./${{ matrix.service }} || echo "Le dossier ./${{ matrix.service }} n'existe pas."

      - name: "S'assurer qu'un Dockerfile existe (génère un défaut sinon)"
        run: |
          set -e
          SERVICE="${{ matrix.service }}"
          DIR="./${SERVICE}"
          mkdir -p "$DIR"

          if [ -f "$DIR/Dockerfile" ]; then
            echo "Dockerfile déjà présent pour $SERVICE, on le garde tel quel."
            exit 0
          fi

          echo "::warning::Aucun Dockerfile trouvé pour $SERVICE, génération d'un Dockerfile par défaut."

          case "$SERVICE" in
            frontend)
              cat > "$DIR/Dockerfile" <<'EOF'
          FROM node:18-alpine AS build
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --ignore-scripts
          COPY . .
          RUN npm run build

          FROM nginx:alpine
          COPY --from=build /app/dist /usr/share/nginx/html
          EXPOSE 80
          EOF
              ;;
            backend)
              cat > "$DIR/Dockerfile" <<'EOF'
          FROM node:18-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev --ignore-scripts
          COPY . .
          RUN addgroup -S appgroup && adduser -S appuser -G appgroup
          USER appuser
          EXPOSE 3000
          CMD ["node", "server.js"]
          EOF
              ;;
            database)
              echo "database: pas de génération de Dockerfile, image officielle utilisée."
              ;;
          esac

      - name: "Build image ${{ matrix.service }} (ou pull si database sans Dockerfile)"
        run: |
          set -e
          SERVICE="${{ matrix.service }}"
          DIR="./${SERVICE}"

          if [ "$SERVICE" = "database" ] && [ ! -f "$DIR/Dockerfile" ]; then
            echo "Pull de l'image officielle mongo:7 pour database"
            docker pull mongo:7
            docker tag mongo:7 database:${{ github.sha }}
          else
            docker build -t ${SERVICE}:${{ github.sha }} "$DIR"
          fi

          docker save ${SERVICE}:${{ github.sha }} -o ${SERVICE}-image.tar

      - name: Sauvegarder l'image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}-image.tar
          retention-days: 1

  ##########################################################################
  # 8. IMAGE SCAN - Trivy
  ##########################################################################
  scan-images:
    runs-on: ubuntu-latest
    needs: build-images
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, database]
    steps:
      - name: Télécharger l'image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.service }}-image
      - name: Charger l'image Docker
        run: docker load -i ${{ matrix.service }}-image.tar

      - name: Scan Trivy - rapport complet (non bloquant, pour diagnostic)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: "table"
          output: "trivy-report-${{ matrix.service }}.txt"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Sauvegarder le rapport Trivy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-report-${{ matrix.service }}.txt
          retention-days: 5

      - name: Scan Trivy (Critical/High = bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Scan Trivy (Medium/Low = informatif)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          severity: "MEDIUM,LOW"
          exit-code: "0"

  ##########################################################################
  # 9. TAG & PUSH - Registry (GitHub Container Registry)
  ##########################################################################
  tag-and-push:
    runs-on: ubuntu-latest
    needs: scan-images
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, database]
    steps:
      - name: Télécharger l'image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.service }}-image
      - name: Charger l'image
        run: docker load -i ${{ matrix.service }}-image.tar
      - name: Login au registre
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag & Push
        run: |
          # ghcr.io exige un nom d'image en minuscules
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}"
          docker tag ${{ matrix.service }}:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker tag ${{ matrix.service }}:${{ github.sha }} "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  ##########################################################################
  # 10. DEPLOY - Staging
  ##########################################################################
  deploy-staging:
    runs-on: ubuntu-latest
    needs: tag-and-push
    environment: staging
    steps:
      - name: Configurer kubectl
        uses: Azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - name: Déployer sur staging
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
          IMAGE_BASE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          kubectl set image deployment/frontend frontend=$IMAGE_BASE/frontend:${{ github.sha }} -n staging
          kubectl set image deployment/backend backend=$IMAGE_BASE/backend:${{ github.sha }} -n staging
          kubectl rollout status deployment/frontend -n staging
          kubectl rollout status deployment/backend -n staging

  ##########################################################################
  # 11. DAST - OWASP ZAP
  ##########################################################################
  dast-owasp-zap:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: ${{ env.STAGING_URL }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-l HIGH"
      - name: Sauvegarder le rapport ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: report_html.html