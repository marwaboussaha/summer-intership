name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-3
  ECR_REGISTRY: 636361171302.dkr.ecr.eu-west-3.amazonaws.com
  ECR_PREFIX: voicecraft-prod
  ECS_CLUSTER: voicecraft-prod-app

jobs:
  ##########################################################################
  # 1. SECRET SCANNING - Gitleaks
  ##########################################################################
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ##########################################################################
  # 2. INSTALL DEPENDENCIES (sanity check build front + back)
  ##########################################################################
  install-dependencies:
    runs-on: ubuntu-latest
    needs: gitleaks
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Installer dependances Frontend
        run: cd frontend && npm ci --ignore-scripts
      - name: Installer dependances Backend
        run: cd backend && npm ci --ignore-scripts

      - name: Build Frontend
        run: cd frontend && npm run build --if-present
      - name: Build Backend
        run: cd backend && npm run build --if-present

  ##########################################################################
  # 3. SAST - SonarQube / SonarCloud
  ##########################################################################
  sast-sonarqube:
    runs-on: ubuntu-latest
    needs: install-dependencies
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Tests + couverture
        run: cd backend && npm ci --ignore-scripts && npm run test:coverage

      # Jest ecrit des chemins relatifs a backend/ ; le scanner tourne a la
      # racine du repo. Sans reecriture, Sonar affiche 0.0 % de couverture.
      - name: Mapper les chemins lcov depuis la racine du repo
        run: |
          set -euo pipefail
          if [ ! -f backend/coverage/lcov.info ]; then
            echo "::error::backend/coverage/lcov.info introuvable."
            exit 1
          fi
          sed -i 's|^SF:|SF:backend/|' backend/coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@13990a695682794b53148ff9f6a8b6e22e43955e # v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Uploader le report SonarQube
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-report
          path: .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  ##########################################################################
  # 4. SAST QUALITY GATE
  ##########################################################################
  sast-quality-gate:
    runs-on: ubuntu-latest
    needs: sast-sonarqube
    timeout-minutes: 10
    steps:
      - name: Telecharger le report SonarQube
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sonar-report
          path: .scannerwork

      - name: Verifier la Quality Gate SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  ##########################################################################
  # 5. SCA - Snyk (Dependency Scan)
  ##########################################################################
  dependency-scan-snyk:
    runs-on: ubuntu-latest
    needs: sast-quality-gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "SCA : Snyk - scan des dependances"
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master @ 2026-09-18
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --all-projects
            --exclude=sandboxes,template,dist,coverage
            --detection-depth=3

  ##########################################################################
  # 6. BUILD - Images frontend / backend / sandbox
  #
  # L'image "database" a disparu : la base de production est DocumentDB,
  # un service manage AWS. A la place, on construit l'image "sandbox"
  # (backend/sandbox/template) lancee par ECS RunTask dans le cluster dedie.
  #
  # Le contexte de build differe par service : voir la variable CONTEXT.
  ##########################################################################
  build-images:
    runs-on: ubuntu-latest
    needs: dependency-scan-snyk
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: backend
            context: ./backend
          - service: sandbox
            context: ./backend/sandbox/template
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Verifier la presence du Dockerfile de ${{ matrix.service }}"
        run: |
          set -euo pipefail
          if [ ! -f "${{ matrix.context }}/Dockerfile" ]; then
            echo "::error::Dockerfile manquant dans ${{ matrix.context }}."
            ls -la "${{ matrix.context }}" || true
            exit 1
          fi

      - name: "Build image ${{ matrix.service }}"
        run: |
          set -euo pipefail
          docker build -t "${{ matrix.service }}:${{ github.sha }}" "${{ matrix.context }}"
          docker save "${{ matrix.service }}:${{ github.sha }}" -o "${{ matrix.service }}-image.tar"

      ######################################################################
      # Test de demarrage du conteneur backend.
      #
      # Ajoute apres une serie d'echecs en production : le Dockerfile copie
      # les dossiers un par un (docker:S6470) et une copie oubliee ne se voit
      # qu'a l'execution (ERR_MODULE_NOT_FOUND), jamais au build. On demarre
      # donc le conteneur ici et on verifie qu'il ne plante pas au chargement
      # des modules. Le crash sur connexion DB est attendu et ignore.
      ######################################################################
      - name: "Smoke test du conteneur ${{ matrix.service }}"
        if: matrix.service == 'backend'
        run: |
          set -uo pipefail
          docker run -d --name smoke -e PORT=3000 "${{ matrix.service }}:${{ github.sha }}" || true
          sleep 8
          LOGS="$(docker logs smoke 2>&1 || true)"
          docker rm -f smoke >/dev/null 2>&1 || true
          echo "$LOGS"
          if echo "$LOGS" | grep -q "ERR_MODULE_NOT_FOUND"; then
            echo "::error::Module manquant dans l'image : un COPY est absent du Dockerfile."
            exit 1
          fi
          echo "Chargement des modules OK."

      - name: Sauvegarder l'image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}-image.tar
          retention-days: 1

  ##########################################################################
  # 7. IMAGE SCAN - Trivy
  ##########################################################################
  scan-images:
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, sandbox]
    steps:
      - name: Telecharger l'image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.service }}-image

      - name: Charger l'image Docker
        run: docker load -i ${{ matrix.service }}-image.tar

      - name: Scan Trivy - rapport complet (non bloquant, pour diagnostic)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: "table"
          output: "trivy-report-${{ matrix.service }}.txt"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"

      - name: Sauvegarder le rapport Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-report-${{ matrix.service }}.txt
          if-no-files-found: warn
          retention-days: 5

      - name: Scan Trivy - format SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Publier le SARIF dans GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@42c378ffbb438be29e3e1848d520fb0a8ee1c271 # v3.38.0
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

      - name: Scan Trivy (Critical/High = bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  ##########################################################################
  # 7 bis. NOTIFICATION - Envoi des rapports Trivy par mail
  ##########################################################################
  notify-scan-results:
    runs-on: ubuntu-latest
    needs: scan-images
    if: always()
    timeout-minutes: 10
    steps:
      - name: Telecharger tous les rapports Trivy
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: trivy-report-*
          path: rapports
          merge-multiple: true

      - name: Preparer le resume
        run: |
          set -euo pipefail
          ls -la rapports/ || echo "Aucun rapport trouve."
          {
            echo "Resultat des scans Trivy"
            echo "Depot  : ${{ github.repository }}"
            echo "Commit : ${{ github.sha }}"
            echo "Statut du job de scan : ${{ needs.scan-images.result }}"
            echo ""
            for f in rapports/*.txt; do
              [ -f "$f" ] || continue
              echo "=== $(basename "$f") ==="
              grep -E "Total:|^[a-z].*\(.*\)$" "$f" | head -20 || true
              echo ""
            done
          } > resume.txt
          cat resume.txt

      - name: Envoyer les rapports par mail
        uses: dawidd6/action-send-mail@62a2d05b79935ad4fb90ce9079928099579c14ac # v9
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ needs.scan-images.result }}] Scan Trivy - ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline <${{ secrets.MAIL_USERNAME }}>
          body: file://resume.txt
          attachments: rapports/*.txt

  ##########################################################################
  # 8. TAG & PUSH - Amazon ECR
  #
  # Remplace ghcr.io. L'authentification passe par OIDC : aucune cle AWS
  # n'est stockee dans GitHub, le role est assume le temps du job et les
  # identifiants expirent au bout d'une heure.
  #
  # Le tag est le SHA du commit. Les depots ECR sont IMMUTABLE : un tag
  # publie ne peut plus etre ecrase, ce qui garantit que l'image deployee
  # est bien celle qui a ete scannee.
  ##########################################################################
  tag-and-push:
    runs-on: ubuntu-latest
    needs: scan-images
    # Saute la publication quand l'infrastructure AWS n'est pas deployee :
    # la variable AWS_DEPLOY_ROLE_ARN n'est renseignee que lorsque le compte
    # AWS est actif. Meme principe que la garde AWS_READY du pipeline infra :
    # la chaine de securite reste verte sans dependre d'une infra allumee.
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write      # requis pour l'authentification OIDC vers AWS
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: [frontend, backend, sandbox]
    steps:
      - name: Telecharger l'image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.service }}-image

      - name: Charger l'image
        run: docker load -i ${{ matrix.service }}-image.tar

      - name: Configurer les identifiants AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Tag & Push vers ECR
        id: tag
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          SRC="${{ matrix.service }}:${{ github.sha }}"
          DEST="${{ env.ECR_REGISTRY }}/${{ env.ECR_PREFIX }}-${{ matrix.service }}"

          docker tag "$SRC" "${DEST}:${SHORT_SHA}"
          docker push "${DEST}:${SHORT_SHA}"

          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image publiee : ${DEST}:${SHORT_SHA}"

  ##########################################################################
  # 9. DEPLOY - ECS Fargate via le depot d'infrastructure
  #
  # Remplace le deploiement Kubernetes. Ce job ne deploie pas lui-meme :
  # il declenche le pipeline Terraform du depot infra avec le tag des
  # images qui viennent d'etre publiees. Ce pipeline calcule un plan,
  # l'envoie par mail, et attend une validation humaine avant d'appliquer.
  #
  # Separation volontaire : le pipeline applicatif produit et valide des
  # images, le pipeline infra decide de ce qui tourne en production.
  ##########################################################################
  trigger-infra-deploy:
    runs-on: ubuntu-latest
    needs: tag-and-push
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    timeout-minutes: 10
    steps:
      - name: Declencher le pipeline infra avec le nouveau tag
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPOSITORY }}
          IMAGE_TAG: ${{ needs.tag-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "${INFRA_TOKEN}" ] || [ -z "${INFRA_REPO}" ]; then
            echo "::error::INFRA_DISPATCH_TOKEN ou INFRA_REPOSITORY manquant."
            echo "Renseignez-les dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            -d "{\"event_type\":\"new-images\",\"client_payload\":{\"image_tag\":\"${IMAGE_TAG}\",\"commit\":\"${{ github.sha }}\"}}"

          echo "Pipeline infra declenche avec le tag ${IMAGE_TAG}."
          echo "Le plan Terraform sera envoye par mail pour validation."

  ##########################################################################
  # 10. DAST - OWASP ZAP contre l'application deployee
  #
  # La cible n'est plus un cluster de staging mais le DNS public de l'ALB,
  # expose en HTTP (pas de nom de domaine ni de certificat dans cette
  # version de l'infrastructure).
  #
  # continue-on-error : l'infrastructure est detruite hors demonstration
  # pour maitriser les couts, l'URL n'est donc pas toujours joignable.
  ##########################################################################
  dast-owasp-zap:
    runs-on: ubuntu-latest
    needs: trigger-infra-deploy
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Verifier que l'application repond
        id: check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -uo pipefail
          if [ -z "${APP_URL}" ]; then
            echo "::warning::APP_URL non defini, scan DAST ignore."
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Le deploiement ECS prend quelques minutes apres le plan Terraform
          sleep 120
          if curl -fsS --max-time 20 "${APP_URL}/api/health" > /dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${APP_URL} injoignable, scan DAST ignore."
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: OWASP ZAP Baseline Scan
        if: steps.check.outputs.reachable == 'true'
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: ${{ vars.APP_URL }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-l HIGH"
          allow_issue_writing: false

      - name: Sauvegarder le rapport ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
          retention-days: 5