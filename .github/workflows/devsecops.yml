name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # permet le lancement manuel (gh workflow run)

# Permissions minimales par défaut ; chaque job élargit si besoin
permissions:
  contents: read

# Annule les runs obsolètes sur une même branche / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_URL: https://staging.monapp.com   # <-- remplacer par la vraie URL

jobs:
  ##########################################################################
  # 1. SECRET SCANNING - Gitleaks
  ##########################################################################
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ##########################################################################
  # 2. INSTALL DEPENDENCIES (sanity check build front + back)
  #    Pas d'upload de node_modules : aucun job aval ne le consommait,
  #    et l'artefact coûtait plusieurs minutes par run.
  ##########################################################################
  install-dependencies:
    runs-on: ubuntu-latest
    needs: gitleaks
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Installer dépendances Frontend
        run: cd frontend && npm ci --ignore-scripts
      - name: Installer dépendances Backend
        run: cd backend && npm ci --ignore-scripts

      - name: Build Frontend
        run: cd frontend && npm run build --if-present
      - name: Build Backend
        run: cd backend && npm run build --if-present

  ##########################################################################
  # 3. SAST - SonarQube / SonarCloud
  #
  # Les tests tournent DANS CE JOB, avant le scan : le fichier lcov.info est
  # écrit sur le disque du runner, et le scanner le lit depuis ce disque.
  # Dans un autre job (machine neuve), il n'existerait plus.
  ##########################################################################
  sast-sonarqube:
    runs-on: ubuntu-latest
    needs: install-dependencies
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Tests + couverture
        run: cd backend && npm ci --ignore-scripts && npm run test:coverage

      # Jest écrit des chemins relatifs à backend/ (SF:utils/sandboxId.js),
      # alors que le scanner tourne à la racine du repo. Sans cette réécriture,
      # Sonar ne résout aucun fichier et jette silencieusement la couverture
      # -> 0.0 % affiché alors que les tests couvrent réellement le code.
      - name: Mapper les chemins lcov depuis la racine du repo
        run: |
          set -euo pipefail
          if [ ! -f backend/coverage/lcov.info ]; then
            echo "::error::backend/coverage/lcov.info introuvable. Les tests ont-ils bien tourné ?"
            exit 1
          fi
          sed -i 's|^SF:|SF:backend/|' backend/coverage/lcov.info
          echo "Chemins après réécriture (doit afficher SF:backend/...) :"
          grep '^SF:' backend/coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@13990a695682794b53148ff9f6a8b6e22e43955e # v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Vérifier que le rapport Sonar existe
        run: |
          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::.scannerwork/report-task.txt introuvable après le scan Sonar."
            exit 1
          fi
          echo "Rapport trouvé :"
          cat .scannerwork/report-task.txt

      - name: Uploader le report SonarQube (report-task.txt)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-report
          path: .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  ##########################################################################
  # 4. SAST QUALITY GATE
  ##########################################################################
  sast-quality-gate:
    runs-on: ubuntu-latest
    needs: sast-sonarqube
    timeout-minutes: 10
    steps:
      - name: Télécharger le report SonarQube
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sonar-report
          path: .scannerwork

      - name: Vérifier que le fichier est bien arrivé
        run: |
          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::report-task.txt absent après téléchargement de l'artefact."
            exit 1
          fi

      - name: Vérifier la Quality Gate SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  ##########################################################################
  # 5. SCA - Snyk (Dependency Scan)
  #
  # --exclude=sandboxes : backend/sandboxes/ contient du code généré à la volée
  # par /api/generate, avec un package.json par sandbox et aucun node_modules.
  # Sans cette exclusion, --all-projects tente de résoudre les dépendances de
  # chacune (45 sur 49 projets détectés) et le job échoue.
  # Le vrai correctif reste `git rm -r --cached backend/sandboxes` ; ceci est
  # un garde-fou si une sandbox est re-committée par accident.
  ##########################################################################
  dependency-scan-snyk:
    runs-on: ubuntu-latest
    needs: sast-quality-gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "SCA : Snyk - scan des dépendances"
        # master = branche mutable (Snyk ne publie pas de tags de release) :
        # SHA à revérifier périodiquement via `git ls-remote https://github.com/snyk/actions master`
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master @ 2026-09-18
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --all-projects
            --exclude=sandboxes,template,dist,coverage
            --detection-depth=3

  ##########################################################################
  # 6. BUILD - Images Front / Back / Database
  #
  # L'ancienne version générait un Dockerfile par défaut quand il manquait,
  # et retombait sur `mongo:7` brut pour la database. C'est exactement ce que
  # la remédiation Trivy avait corrigé (image custom mongo:7.0.15 durcie) :
  # le fallback réintroduisait silencieusement les CVE et faisait échouer
  # Trivy plus loin. On échoue donc tôt, avec un message clair.
  ##########################################################################
  build-images:
    runs-on: ubuntu-latest
    needs: dependency-scan-snyk
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, database]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Vérifier la présence du Dockerfile de ${{ matrix.service }}"
        run: |
          set -euo pipefail
          DIR="./${{ matrix.service }}"
          if [ ! -f "$DIR/Dockerfile" ]; then
            echo "::error::Dockerfile manquant dans $DIR."
            echo "Chaque service doit fournir son propre Dockerfile durci"
            echo "(la database utilise une image mongo pinnée, pas mongo:7 brut)."
            ls -la "$DIR" || true
            exit 1
          fi
          echo "Dockerfile trouvé pour ${{ matrix.service }} :"
          cat "$DIR/Dockerfile"

      - name: "Build image ${{ matrix.service }}"
        run: |
          set -euo pipefail
          docker build -t "${{ matrix.service }}:${{ github.sha }}" "./${{ matrix.service }}"
          docker save "${{ matrix.service }}:${{ github.sha }}" -o "${{ matrix.service }}-image.tar"

      - name: Sauvegarder l'image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}-image.tar
          retention-days: 1

  ##########################################################################
  # 7. IMAGE SCAN - Trivy
  #    2 appels au lieu de 3 (1 rapport complet informatif + 1 bloquant),
  #    chaque appel retéléchargeant la base de vulnérabilités.
  ##########################################################################
  scan-images:
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, database]
    steps:
      - name: Télécharger l'image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.service }}-image

      - name: Charger l'image Docker
        run: docker load -i ${{ matrix.service }}-image.tar

      - name: Scan Trivy - rapport complet (non bloquant, pour diagnostic)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: "table"
          output: "trivy-report-${{ matrix.service }}.txt"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"

      - name: Sauvegarder le rapport Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-report-${{ matrix.service }}.txt
          if-no-files-found: warn
          retention-days: 5

      - name: Scan Trivy (Critical/High = bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  ##########################################################################
  # 8. TAG & PUSH - GitHub Container Registry
  #    Uniquement sur push vers main : une PR ne doit pas publier d'image.
  ##########################################################################
  tag-and-push:
    runs-on: ubuntu-latest
    needs: scan-images
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, database]
    steps:
      - name: Télécharger l'image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.service }}-image

      - name: Charger l'image
        run: docker load -i ${{ matrix.service }}-image.tar

      - name: Login au registre
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & Push
        run: |
          set -euo pipefail
          # ghcr.io exige un nom d'image en minuscules
          REPO_LC="$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          SRC="${{ matrix.service }}:${{ github.sha }}"
          DEST="${{ env.REGISTRY }}/${REPO_LC}/${{ matrix.service }}"

          docker tag "$SRC" "${DEST}:${{ github.sha }}"
          docker tag "$SRC" "${DEST}:latest"
          docker push "${DEST}:${{ github.sha }}"
          docker push "${DEST}:latest"

  ##########################################################################
  # 9. DEPLOY - Staging
  ##########################################################################
  deploy-staging:
    runs-on: ubuntu-latest
    needs: tag-and-push
    if: github.event_name != 'pull_request'
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Configurer kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Écrire le kubeconfig (secret via env, jamais interpolé dans run)
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KUBE_CONFIG" > kubeconfig.yaml

      - name: Déployer sur staging
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          set -euo pipefail
          REPO_LC="$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          BASE="${{ env.REGISTRY }}/${REPO_LC}"

          kubectl set image deployment/frontend \
            frontend="${BASE}/frontend:${{ github.sha }}" -n staging
          kubectl set image deployment/backend \
            backend="${BASE}/backend:${{ github.sha }}" -n staging
          kubectl rollout status deployment/frontend -n staging --timeout=5m
          kubectl rollout status deployment/backend  -n staging --timeout=5m

      - name: Nettoyer le kubeconfig
        if: always()
        run: rm -f kubeconfig.yaml

  ##########################################################################
  # 10. DAST - OWASP ZAP
  #     allow_issue_writing: false -> sinon l'action tente de créer une issue
  #     GitHub et échoue en 403 avec des permissions en lecture seule.
  ##########################################################################
  dast-owasp-zap:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: ${{ env.STAGING_URL }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-l HIGH"
          allow_issue_writing: false

      - name: Sauvegarder le rapport ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
          retention-days: 5