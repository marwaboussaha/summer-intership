##############################################################################
# devsecops.yml
# Pipeline DevSecOps (GitLab CI/CD)
#
# Ordre : Gitleaks -> Install Dependencies -> SAST (SonarQube) -> Quality Gate
#         -> SCA (Snyk) -> Build (front/back/db) -> Trivy -> Tag & Push
#         -> Deploy -> DAST (OWASP ZAP)
##############################################################################

stages:
  - secret-scan
  - install
  - sast
  - quality-gate
  - dependency-scan
  - build
  - image-scan
  - push
  - deploy
  - dast

variables:
  REGISTRY: "registry.gitlab.com/${CI_PROJECT_PATH}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  SONAR_HOST_URL: "https://sonarqube.example.com"
  STAGING_URL: "https://staging.monapp.com"

##############################################################################
# 1. SECRET SCANNING - Gitleaks
##############################################################################
gitleaks:
  stage: secret-scan
  image: zricethezav/gitleaks:latest
  script:
    - echo "Scan des secrets avec Gitleaks..."
    - gitleaks detect --source . --verbose --redact --exit-code 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'
  allow_failure: false   # FAIL -> STOP

##############################################################################
# 2. INSTALL DEPENDENCIES
##############################################################################
install-dependencies:
  stage: install
  image: node:18-alpine
  script:
    - echo "Installation des dépendances Front..."
    - cd frontend && npm ci && cd ..
    - echo "Installation des dépendances Back..."
    - cd backend && npm ci && cd ..
  artifacts:
    paths:
      - frontend/node_modules
      - backend/node_modules
    expire_in: 1 hour
  allow_failure: false   # FAIL -> STOP

##############################################################################
# 3. SAST - SonarQube
##############################################################################
sast-sonarqube:
  stage: sast
  image: sonarsource/sonar-scanner-cli:latest
  needs: ["install-dependencies"]
  script:
    - echo "Analyse statique du code avec SonarQube..."
    - sonar-scanner
      -Dsonar.projectKey=${CI_PROJECT_NAME}
      -Dsonar.sources=.
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.login=${SONAR_TOKEN}
  allow_failure: false

##############################################################################
# 4. SAST QUALITY GATE - vérification du statut SonarQube
##############################################################################
sast-quality-gate:
  stage: quality-gate
  image: curlimages/curl:latest
  needs: ["sast-sonarqube"]
  script:
    - echo "Vérification de la Quality Gate SonarQube..."
    - |
      STATUS=$(curl -s -u ${SONAR_TOKEN}: \
        "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${CI_PROJECT_NAME}" \
        | grep -o '"status":"[A-Z]*"' | head -1 | cut -d'"' -f4)
      echo "Quality Gate status: $STATUS"
      if [ "$STATUS" != "OK" ]; then
        echo "❌ Quality Gate échouée (Critical/High vulnerabilities ou seuils non atteints)"
        exit 1
      fi
      echo "✅ Quality Gate passée"
  allow_failure: false   # Gate Failed -> STOP

##############################################################################
# 5. SCA - Snyk (Dependency Scan)
##############################################################################
dependency-scan-snyk:
  stage: dependency-scan
  image: snyk/snyk:node
  needs: ["install-dependencies", "sast-quality-gate"]
  script:
    - echo "Scan des dépendances avec Snyk..."
    - snyk auth ${SNYK_TOKEN}
    - snyk test --severity-threshold=high --all-projects
  allow_failure: false   # Critical/High -> STOP (Medium/Low géré par --severity-threshold)

##############################################################################
# 6. BUILD - Images Front / Back / Database
##############################################################################
build-frontend:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  needs: ["dependency-scan-snyk"]
  script:
    - docker build -t ${REGISTRY}/frontend:${IMAGE_TAG} ./frontend
    - docker save ${REGISTRY}/frontend:${IMAGE_TAG} -o frontend-image.tar
  artifacts:
    paths: [frontend-image.tar]
    expire_in: 1 hour
  allow_failure: false

build-backend:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  needs: ["dependency-scan-snyk"]
  script:
    - docker build -t ${REGISTRY}/backend:${IMAGE_TAG} ./backend
    - docker save ${REGISTRY}/backend:${IMAGE_TAG} -o backend-image.tar
  artifacts:
    paths: [backend-image.tar]
    expire_in: 1 hour
  allow_failure: false

build-database:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  needs: ["dependency-scan-snyk"]
  script:
    - docker build -t ${REGISTRY}/database:${IMAGE_TAG} ./database
    - docker save ${REGISTRY}/database:${IMAGE_TAG} -o database-image.tar
  artifacts:
    paths: [database-image.tar]
    expire_in: 1 hour
  allow_failure: false

##############################################################################
# 7. IMAGE SCAN - Trivy (Vulnerability Scan)
##############################################################################
.trivy-template: &trivy-scan
  stage: image-scan
  image: aquasec/trivy:latest
  script:
    - docker load -i ${IMAGE_FILE}
    - echo "Scan Trivy de l'image ${IMAGE_NAME}..."
    - trivy image
      --severity CRITICAL,HIGH
      --exit-code 1
      --no-progress
      ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    - trivy image
      --severity MEDIUM,LOW
      --exit-code 0
      --no-progress
      ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
  allow_failure: false   # Critical/High -> STOP

scan-frontend-image:
  <<: *trivy-scan
  needs: ["build-frontend"]
  variables:
    IMAGE_FILE: frontend-image.tar
    IMAGE_NAME: frontend

scan-backend-image:
  <<: *trivy-scan
  needs: ["build-backend"]
  variables:
    IMAGE_FILE: backend-image.tar
    IMAGE_NAME: backend

scan-database-image:
  <<: *trivy-scan
  needs: ["build-database"]
  variables:
    IMAGE_FILE: database-image.tar
    IMAGE_NAME: database

##############################################################################
# 8. TAG & PUSH - Registry
##############################################################################
tag-and-push:
  stage: push
  image: docker:24
  services: [docker:24-dind]
  needs:
    - scan-frontend-image
    - scan-backend-image
    - scan-database-image
  script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin ${REGISTRY}
    - for svc in frontend backend database; do
        docker load -i ${svc}-image.tar;
        docker tag ${REGISTRY}/${svc}:${IMAGE_TAG} ${REGISTRY}/${svc}:latest;
        docker push ${REGISTRY}/${svc}:${IMAGE_TAG};
        docker push ${REGISTRY}/${svc}:latest;
      done
  allow_failure: false

##############################################################################
# 9. DEPLOY - Staging
##############################################################################
deploy-staging:
  stage: deploy
  image: bitnami/kubectl:latest
  needs: ["tag-and-push"]
  script:
    - echo "Déploiement sur l'environnement de staging..."
    - kubectl set image deployment/frontend frontend=${REGISTRY}/frontend:${IMAGE_TAG} -n staging
    - kubectl set image deployment/backend backend=${REGISTRY}/backend:${IMAGE_TAG} -n staging
    - kubectl set image deployment/database database=${REGISTRY}/database:${IMAGE_TAG} -n staging
    - kubectl rollout status deployment/frontend -n staging
    - kubectl rollout status deployment/backend -n staging
  allow_failure: false   # FAIL -> STOP

##############################################################################
# 10. DAST - OWASP ZAP
##############################################################################
dast-owasp-zap:
  stage: dast
  image: ghcr.io/zaproxy/zaproxy:stable
  needs: ["deploy-staging"]
  script:
    - echo "Scan dynamique (DAST) avec OWASP ZAP sur ${STAGING_URL}..."
    - zap-baseline.py
      -t ${STAGING_URL}
      -r zap-report.html
      -l HIGH
      -I
  artifacts:
    paths: [zap-report.html]
    when: always
  allow_failure: false   # Critical/High -> STOP / Rollback

##############################################################################
# Fin du pipeline : si toutes les étapes passent -> déploiement production
# (à ajouter séparément avec approbation manuelle, ex: "when: manual")
##############################################################################
